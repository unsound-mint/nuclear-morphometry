[project]
name = "nuclear-morphometry"
version = "0.1.0"
description = "GPU-first microscopy analysis pipeline for BIOL 490 thesis (colorectal-cancer nuclei, 2D/3D)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "polars>=1.9",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "typer>=0.12",
    "bioio>=1.1",
    "bioio-czi>=1.1",
    "bioio-tifffile>=1.1",
    "tifffile>=2024.8",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "cellpose>=3.1",
]
gui = [
    "napari[pyqt6]>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
nuclear-morphometry = "nuclear_morphometry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuclear_morphometry"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes / pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "N",                # pep8-naming
    "ANN",              # annotations
    "PTH",              # prefer pathlib
]
ignore = [
    "ANN401",  # Any is sometimes unavoidable at third-party boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "N802"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "cellpose_model: requires downloaded Cellpose model weights",
    "gui: requires the optional 'gui' dependency group (napari + Qt); runs headlessly offscreen",
]
