name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `gpu` is installed on the CPU runner because the backend adapter and its
      # mocked boundary tests import torch/cellpose. Real CUDA inference remains
      # a separately marked hardware validation. The optional napari viewer has
      # its own job below so core CI does not acquire a Qt dependency.
      - name: Sync dependencies
        run: uv sync --extra dev --extra gpu

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Unit and CPU integration tests
        run: >-
          uv run pytest tests/unit tests/integration -q
          -m "not gpu and not cellpose_model and not gui"

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync GUI test dependencies
        run: uv sync --extra dev --extra gui

      - name: Napari QC viewer integration tests
        run: xvfb-run -a uv run pytest tests/integration/test_qc_viewer.py -q
