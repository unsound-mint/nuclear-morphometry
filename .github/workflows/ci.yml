name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `gpu` extra (torch/cellpose) is installed on CPU-only runners because
      # segmentation/cellpose_backend.py currently imports torch at module level,
      # so it (and its unit tests, which exercise fail-loud boundaries via mocks,
      # never real GPU inference) must be importable for collection/pyright to
      # succeed at all. `gui` (napari/PyQt6) is skipped -- nothing depends on it
      # yet (the QC viewer is not implemented). Real GPU inference is covered by
      # tests/integration/test_cellpose_gpu.py, which self-skips without CUDA and
      # is never required to pass here (spec section 38).
      - name: Sync dependencies
        run: uv sync --extra dev --extra gpu

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Unit and CPU integration tests
        run: uv run pytest tests/unit tests/integration -q -m "not gpu and not cellpose_model"
