name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `gpu` is installed on the CPU runner because the backend adapter and its
      # mocked boundary tests import torch/cellpose. Real CUDA inference remains
      # a separately marked hardware validation. `gui` is installed so Pyright
      # can resolve the napari viewer's imports; the viewer tests only run in
      # the gui-test job below, under a virtual display.
      - name: Sync dependencies
        run: uv sync --extra dev --extra gpu --extra gui

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Unit and CPU integration tests
        run: >-
          uv run pytest tests/unit tests/integration -q
          -m "not gpu and not cellpose_model and not gui"

  gui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Qt's xcb platform plugin needs these system libraries on the runner.
      - name: Install Qt system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0
          libxcb-cursor0

      - name: Sync GUI test dependencies
        run: uv sync --extra dev --extra gui

      - name: Napari QC viewer integration tests
        run: xvfb-run -a uv run pytest tests/integration/test_qc_viewer.py -q
