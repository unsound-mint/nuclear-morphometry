[experiment]
name = "dayana_thesis_2d_example"
manifest = "manifest.csv"
output_root = "results"

[analysis]
mode = "2d"
# The preliminary CellProfiler analysis was 2D. For confocal Z-stacks this
# projection must be explicit; change it only as part of the documented
# legacy-parity protocol.
projection = "max"

[input]
hoechst_channel = "Hoechst"
strict_physical_spacing = true

[segmentation]
backend = "cellpose"
device = "cuda"
model = "auto"
normalize_for_segmentation = true
percentile_low = 1.0
percentile_high = 99.8
diameter_um = 0.0
tile = true
batch_size = 0

[measurements]
morphology = true
intensity = true
# Preserve the predefined preliminary Hoechst feature family. Pixel distances
# 3/5/10/20 and five radial bins are legacy starting points, not yet accepted
# biological scales for the final dataset; validate them against real X/Y
# calibration and the CellProfiler parity export before thesis use.
texture_2d = true
texture_distances_px = [3, 5, 10, 20]
radial_distribution_2d = true
radial_bins = 5

[qc]
flag_border_objects = true
exclude_border_from_default_analysis = true
save_overlays = true
overlay_samples_per_group = 5
random_seed = 20260906

[performance]
prefetch_fields = 1

[output]
save_masks = true
write_csv = true
